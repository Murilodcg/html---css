<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>

        h1{
            
            display: inline;
            background-color: lightgray;
            height: 83px;
            width: 242px;  
            padding: 3px;
        
            margin: 3px auto 3px auto;

            border: 10px solid darkgray;
        }

        a{
           

            border: 2px none red;

       

            padding: 2px;


            margin: 2px;

        }

        a:hover{
            border-style: dashed;
        
            font: bolder;
            font-size: 20px;
        }

    </style>
</head>
<body>
    
    <h1>Exemplo de caixa box-level</h1>
    <p>
        Paragráfos tambem são exemplos de caixas box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos  ver como funciona!
    </p>

</body>
</html>
