<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: blue;
            text-decoration: none;
        }

        a:visited{
            color: yellow;
        }

        a:hover{
            text-decoration: underline;
            color: black;
        }

        a:active{
            color: red;
        }

        ul{
            width: 50px;
            height: 70px;
            font-size: 50px;
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://www.facebook.com/murilo.neves.10485/" target="_blank">Facebook</a></li>
        <li><a href="https://www.instagram.com/murilonev/" target="_blank">Instagram</a></li>
        <li><a href="https://www.youtube.com/" target="_blank">Youtube</a></li>
    </ul>
</body>
</html>
